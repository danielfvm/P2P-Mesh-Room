<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Mesh Room - Discord Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        discord: {
                            dark: '#313338',
                            darker: '#1e1f22',
                            sidebar: '#2b2d31',
                            accent: '#5865f2',
                            accentHover: '#4752c4',
                            green: '#23a55a',
                            red: '#f23f43'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body class="bg-discord-darker text-gray-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- LANDING / LOBBY SELECTION VIEW -->
    <div id="landing-view" class="flex-1 flex items-center justify-center p-6 bg-discord-darker">
        <div class="bg-discord-dark max-w-md w-full p-8 rounded-2xl shadow-2xl border border-gray-700/50 flex flex-col gap-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold tracking-tight text-white mb-2">P2P Rooms</h1>
                <p class="text-gray-400 text-sm">Secure, decentralized voice, video & screen sharing.</p>
            </div>

            <!-- User Profile Setup -->
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold uppercase tracking-wider text-gray-400">Your Profile</label>
                <div class="flex gap-3 items-center">
                    <input type="text" id="username-input" placeholder="Enter username..." class="flex-1 bg-discord-darker border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-discord-accent text-white">
                    <select id="avatar-select" class="bg-discord-darker border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-discord-accent text-white">
                        <option value="🦊">🦊 Fox</option>
                        <option value="🐱">🐱 Cat</option>
                        <option value="🐶">🐶 Dog</option>
                        <option value="🐼">🐼 Panda</option>
                        <option value="🤖">🤖 Robot</option>
                        <option value="👽">👽 Alien</option>
                    </select>
                </div>
            </div>

            <hr class="border-gray-700/50">

            <!-- Tabs / Actions -->
            <div class="flex flex-col gap-4">
                <!-- Create Lobby -->
                <div class="flex flex-col gap-2">
                    <h2 class="text-sm font-semibold text-gray-300">Create a New Lobby</h2>
                    <input type="text" id="create-lobby-name" placeholder="Lobby Name" class="bg-discord-darker border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-discord-accent text-white">
                    <input type="password" id="create-lobby-pass" placeholder="Password (Optional)" class="bg-discord-darker border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-discord-accent text-white">
                    <button id="create-lobby-btn" class="bg-discord-accent hover:bg-discord-accentHover text-white font-medium py-2 px-4 rounded-lg transition duration-200 text-sm">Create Lobby</button>
                </div>

                <div class="flex items-center my-1">
                    <div class="flex-1 border-t border-gray-700"></div>
                    <span class="px-3 text-xs text-gray-500 uppercase">or join</span>
                    <div class="flex-1 border-t border-gray-700"></div>
                </div>

                <!-- Join Code / Invite -->
                <div class="flex flex-col gap-2">
                    <h2 class="text-sm font-semibold text-gray-300">Join via Invite Code</h2>
                    <div class="flex gap-2">
                        <input type="text" id="join-code-input" placeholder="Enter Invite Code" class="flex-1 bg-discord-darker border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-discord-accent text-white">
                        <button id="join-code-btn" class="bg-discord-green hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition duration-200 text-sm">Join</button>
                    </div>
                </div>
            </div>

            <!-- History -->
            <div id="history-section" class="flex flex-col gap-2 hidden">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">Recent Lobbies</h2>
                <div id="history-list" class="flex flex-col gap-1 max-h-32 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <!-- ROOM VIEW -->
    <div id="room-view" class="flex-1 flex hidden overflow-hidden">
        
        <!-- Main Content (Video / Stream Grid) -->
        <div class="flex-1 flex flex-col bg-discord-dark relative">
            <!-- Top Bar -->
            <div class="h-14 border-b border-gray-700/50 flex items-center justify-between px-6 bg-discord-darker/50">
                <div class="flex items-center gap-3">
                    <span id="room-title-display" class="font-bold text-lg text-white">Lobby</span>
                    <span class="text-xs bg-discord-accent/20 text-discord-accent px-2 py-0.5 rounded-full font-medium" id="room-id-badge">ID: ...</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="share-invite-btn" class="bg-discord-accent hover:bg-discord-accentHover text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-user-plus"></i> Invite
                    </button>
                    <button id="exit-room-btn" class="bg-discord-red/20 hover:bg-discord-red text-discord-red hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Exit Lobby
                    </button>
                </div>
            </div>

            <!-- Video / Media Grid Area -->
            <div id="media-grid" class="flex-1 p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto items-center justify-center">
                <!-- Dynamic Tiles injected here -->
            </div>

            <!-- Control Bar (Bottom Floating/Fixed) -->
            <div class="h-20 bg-discord-darker flex items-center justify-center gap-4 px-6 border-t border-gray-700/50">
                <button id="toggle-mic" class="w-12 h-12 rounded-full bg-discord-sidebar hover:bg-gray-600 flex items-center justify-center text-white transition text-lg" title="Toggle Mic">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button id="toggle-cam" class="w-12 h-12 rounded-full bg-discord-sidebar hover:bg-gray-600 flex items-center justify-center text-white transition text-lg" title="Toggle Camera">
                    <i class="fa-solid fa-video"></i>
                </button>
                <button id="toggle-screen" class="w-12 h-12 rounded-full bg-discord-sidebar hover:bg-gray-600 flex items-center justify-center text-white transition text-lg" title="Share Screen">
                    <i class="fa-solid fa-desktop"></i>
                </button>
            </div>
        </div>

        <!-- Right Sidebar (Room Members - Full Right Column) -->
        <div class="w-80 bg-discord-sidebar border-l border-gray-700/50 flex flex-col">
            <div class="h-14 border-b border-gray-700/50 flex items-center px-4 font-bold text-sm tracking-wider uppercase text-gray-400">
                Room Members (<span id="member-count">0</span>)
            </div>
            <div id="members-list" class="flex-1 p-4 overflow-y-auto flex flex-col gap-2">
                <!-- Members listed here -->
            </div>
        </div>
    </div>

    <!-- PASSWORD MODAL -->
    <div id="password-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
        <div class="bg-discord-dark p-6 rounded-2xl max-w-sm w-full border border-gray-700 flex flex-col gap-4">
            <h3 class="text-lg font-bold text-white">Enter Lobby Password</h3>
            <p class="text-xs text-gray-400">This lobby is password protected.</p>
            <input type="password" id="modal-password-input" placeholder="Password..." class="bg-discord-darker border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-discord-accent text-white">
            <div class="flex justify-end gap-2 mt-2">
                <button id="cancel-password-btn" class="px-4 py-2 rounded-lg bg-gray-700 text-sm font-medium hover:bg-gray-600">Cancel</button>
                <button id="submit-password-btn" class="px-4 py-2 rounded-lg bg-discord-accent text-sm font-medium hover:bg-discord-accentHover">Join</button>
            </div>
        </div>
    </div>

    <!-- INVITE POPUP MODAL -->
    <div id="invite-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
        <div class="bg-discord-dark p-6 rounded-2xl max-w-md w-full border border-gray-700 flex flex-col items-center gap-4 text-center">
            <h3 class="text-lg font-bold text-white">Invite Friends</h3>
            <p class="text-xs text-gray-400">Scan QR code or copy invite link below.</p>
            <div class="bg-white p-3 rounded-xl">
                <img id="invite-qr-code" src="" alt="QR Code" class="w-40 h-40 object-contain">
            </div>
            <div class="flex w-full gap-2 mt-2">
                <input type="text" id="invite-url-input" readonly class="flex-1 bg-discord-darker border border-gray-700 rounded-lg px-3 py-2 text-xs text-gray-300 focus:outline-none">
                <button id="copy-invite-btn" class="bg-discord-accent hover:bg-discord-accentHover text-white px-4 py-2 rounded-lg text-xs font-medium transition">Copy</button>
            </div>
            <button id="close-invite-modal" class="mt-2 text-xs text-gray-400 hover:text-white underline">Close</button>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        // State
        let peer = null;
        let myPeerId = null;
        let myStream = null;
        let screenStream = null;
        let activeConnections = {}; // peerId -> { conn, call, stream, username, avatar, isScreen }
        let peersInRoom = {}; // peerId -> { username, avatar }
        let myUsername = "User_" + Math.floor(Math.random() * 1000);
        let myAvatar = "🦊";
        let currentLobbyId = null;
        let currentLobbyName = "";
        let lobbyPassword = "";
        let targetPasswordAttempt = "";
        let pendingJoinLobbyId = null;

        // DOM Elements
        const landingView = document.getElementById('landing-view');
        const roomView = document.getElementById('room-view');
        const usernameInput = document.getElementById('username-input');
        const avatarSelect = document.getElementById('avatar-select');
        const createLobbyNameInput = document.getElementById('create-lobby-name');
        const createLobbyPassInput = document.getElementById('create-lobby-pass');
        const createLobbyBtn = document.getElementById('create-lobby-btn');
        const joinCodeInput = document.getElementById('join-code-input');
        const joinCodeBtn = document.getElementById('join-code-btn');
        const historySection = document.getElementById('history-section');
        const historyList = document.getElementById('history-list');
        
        const mediaGrid = document.getElementById('media-grid');
        const membersList = document.getElementById('members-list');
        const memberCount = document.getElementById('member-count');
        const roomTitleDisplay = document.getElementById('room-title-display');
        const roomIdBadge = document.getElementById('room-id-badge');
        const exitRoomBtn = document.getElementById('exit-room-btn');
        const shareInviteBtn = document.getElementById('share-invite-btn');

        const toggleMicBtn = document.getElementById('toggle-mic');
        const toggleCamBtn = document.getElementById('toggle-cam');
        const toggleScreenBtn = document.getElementById('toggle-screen');

        const passwordModal = document.getElementById('password-modal');
        const modalPasswordInput = document.getElementById('modal-password-input');
        const cancelPasswordBtn = document.getElementById('cancel-password-btn');
        const submitPasswordBtn = document.getElementById('submit-password-btn');

        const inviteModal = document.getElementById('invite-modal');
        const inviteQrCode = document.getElementById('invite-qr-code');
        const inviteUrlInput = document.getElementById('invite-url-input');
        const copyInviteBtn = document.getElementById('copy-invite-btn');
        const closeInviteModal = document.getElementById('close-invite-modal');

        // Init Profile
        usernameInput.value = myUsername;
        usernameInput.addEventListener('input', (e) => { myUsername = e.target.value.trim() || "Anonymous"; });
        avatarSelect.addEventListener('change', (e) => { myAvatar = e.target.value; });

        // Load History
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('p2p_lobby_history') || '[]'); } catch(e) { return []; }
        }
        function saveHistory(lobby) {
            let hist = getHistory().filter(l => l.id !== lobby.id);
            hist.unshift(lobby);
            if(hist.length > 10) hist.pop();
            localStorage.setItem('p2p_lobby_history', JSON.stringify(hist));
            renderHistory();
        }
        function renderHistory() {
            const hist = getHistory();
            if(hist.length === 0) {
                historySection.classList.add('hidden');
                return;
            }
            historySection.classList.remove('hidden');
            historyList.innerHTML = '';
            hist.forEach(l => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-discord-darker p-2 rounded-lg text-sm";
                div.innerHTML = `
                    <span class="truncate cursor-pointer flex-1 text-gray-300 hover:text-white" title="${l.name}">${l.name}</span>
                    <div class="flex items-center gap-2">
                        <button class="join-hist bg-discord-accent px-2 py-1 rounded text-xs text-white" data-id="${l.id}">Join</button>
                        <button class="del-hist text-gray-500 hover:text-discord-red px-1" data-id="${l.id}"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                div.querySelector('.join-hist').addEventListener('click', () => {
                    joinLobby(l.id, l.name);
                });
                div.querySelector('.del-hist').addEventListener('click', (e) => {
                    e.stopPropagation();
                    let updated = getHistory().filter(item => item.id !== l.id);
                    localStorage.setItem('p2p_lobby_history', JSON.stringify(updated));
                    renderHistory();
                });
                historyList.appendChild(div);
            });
        }
        renderHistory();

        // Check invite query param on load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const inviteCode = urlParams.get('invite');
            if(inviteCode) {
                joinCodeInput.value = inviteCode;
                setTimeout(() => {
                    if(confirm("You have an invite link to join a lobby. Join now?")) {
                        joinLobby(inviteCode);
                    }
                }, 500);
            }
        });

        // Create Lobby
        createLobbyBtn.addEventListener('click', () => {
            const name = createLobbyNameInput.value.trim() || "Unnamed Lobby";
            const pass = createLobbyPassInput.value;
            // Generate secure random ID for the peer lobby coordinator/host
            const randomLobbyId = 'lobby_' + Math.random().toString(36.25).substring(2, 10) + Math.random().toString(36).substring(2, 6);
            startLobby(randomLobbyId, name, pass, true);
        });

        // Join Lobby
        joinCodeBtn.addEventListener('click', () => {
            const code = joinCodeInput.value.trim();
            if(!code) return alert("Please enter a valid invite code or lobby ID.");
            joinLobby(code);
        });

        function startLobby(lobbyId, name, password, isHost) {
            currentLobbyId = lobbyId;
            currentLobbyName = name;
            lobbyPassword = password || "";

            // Initialize PeerJS with random peer ID
            peer = new Peer(null, {
                debug: 1
            });

            peer.on('open', (id) => {
                myPeerId = id;
                if(isHost) {
                    // Host sets up connection handler
                    setupPeerServer(true);
                    enterRoomUI();
                } else {
                    // Connect to host/lobby peer
                    connectToLobby(lobbyId);
                }
            });

            peer.on('error', (err) => {
                console.error(err);
                alert("Peer connection error: " + err.type);
            });
        }

        function joinLobby(lobbyId) {
            pendingJoinLobbyId = lobbyId;
            // First connect temporarily to check if password is required or query host metadata
            const tempPeer = new Peer();
            tempPeer.on('open', (id) => {
                const conn = tempPeer.connect(lobbyId, { metadata: { type: 'AUTH_REQUEST', username: myUsername } });
                
                let responded = false;
                conn.on('data', (data) => {
                    responded = true;
                    tempPeer.destroy();
                    if(data.status === 'PASSWORD_REQUIRED') {
                        passwordModal.classList.remove('hidden');
                    } else if(data.status === 'OK') {
                        startLobby(lobbyId, data.lobbyName || "Lobby", data.password || "", false);
                    } else if(data.status === 'DENIED') {
                        alert("Incorrect password or access denied.");
                    }
                });

                setTimeout(() => {
                    if(!responded) {
                        tempPeer.destroy();
                        // Fallback direct join if host doesn't support auth handshake middleware
                        startLobby(lobbyId, "Lobby", "", false);
                    }
                }, 3000);
            });
        }

        submitPasswordBtn.addEventListener('click', () => {
            const pass = modalPasswordInput.value;
            passwordModal.classList.add('hidden');
            // Join with password
            startLobbyWithPassword(pendingJoinLobbyId, pass);
        });

        cancelPasswordBtn.addEventListener('click', () => {
            passwordModal.classList.add('hidden');
        });

        function startLobbyWithPassword(lobbyId, password) {
            currentLobbyId = lobbyId;
            lobbyPassword = password;
            peer = new Peer();
            peer.on('open', (id) => {
                myPeerId = id;
                connectToLobby(lobbyId, password);
            });
        }

        function connectToLobby(lobbyId, password = "") {
            // Connect to lobby host
            const conn = peer.connect(lobbyId, {
                metadata: { type: 'JOIN', username: myUsername, avatar: myAvatar, password: password }
            });

            conn.on('open', () => {
                setupConnectionEvents(conn);
            });

            conn.on('error', (err) => {
                alert("Failed to connect to lobby.");
            });

            setupPeerServer(false);
        }

        function setupPeerServer(isHost) {
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if(data.type === 'AUTH_REQUEST') {
                        if(lobbyPassword && data.password !== lobbyPassword) {
                            conn.send({ status: 'DENIED' });
                        } else {
                            conn.send({ status: 'OK', lobbyName: currentLobbyName, password: lobbyPassword });
                        }
                    } else if(data.type === 'JOIN') {
                        if(lobbyPassword && data.password !== lobbyPassword) {
                            conn.send({ status: 'DENIED' });
                            return;
                        }
                        // Accept peer
                        activeConnections[conn.peer] = { conn, username: data.username, avatar: data.avatar };
                        peersInRoom[conn.peer] = { username: data.username, avatar: data.avatar };
                        
                        // Broadcast member list update & peer sync
                        broadcastPeersList();
                        updateMembersUI();
                        rebuildMediaGrid();

                        // Call the new peer with our local stream if available
                        if(myStream) {
                            const call = peer.call(conn.peer, myStream, { metadata: { type: 'cam', username: myUsername, avatar: myAvatar } });
                            setupCallEvents(call, conn.peer);
                        }
                    } else if(data.type === 'PEERS_UPDATE') {
                        // Update mesh peers list
                        data.peers.forEach(p => {
                            if(p.id !== peer.id && !activeConnections[p.id]) {
                                connectToPeer(p.id, p.username, p.avatar);
                            }
                        });
                    } else if(data.type === 'USER_INFO') {
                        peersInRoom[conn.peer] = { username: data.username, avatar: data.avatar };
                        if(activeConnections[conn.peer]) {
                            activeConnections[conn.peer].username = data.username;
                            activeConnections[conn.peer].avatar = data.avatar;
                        }
                        updateMembersUI();
                        rebuildMediaGrid();
                    }
                });
            });

            peer.on('call', (call) => {
                // Answer incoming call with local stream (if any)
                navigator.mediaDevices?.getUserMedia({ video: true, audio: true }).then(stream => {
                    myStream = stream;
                    call.answer(myStream);
                }).catch(() => {
                    call.answer(); // Answer without stream if permissions denied
                });

                setupCallEvents(call, call.peer, call.metadata);
            });

            enterRoomUI();
            saveHistory({ id: currentLobbyId, name: currentLobbyName });
        }

        function connectToPeer(peerId, username, avatar) {
            if(activeConnections[peerId]) return;
            const conn = peer.connect(peerId, {
                metadata: { type: 'JOIN', username: myUsername, avatar: myAvatar, password: lobbyPassword }
            });

            conn.on('open', () => {
                activeConnections[peerId] = { conn, username, avatar };
                peersInRoom[peerId] = { username, avatar };
                updateMembersUI();
                rebuildMediaGrid();

                if(myStream) {
                    const call = peer.call(peerId, myStream, { metadata: { type: 'cam', username: myUsername, avatar: myAvatar } });
                    setupCallEvents(call, peerId);
                }
            });
        }

        function setupConnectionEvents(conn) {
            activeConnections[conn.peer] = { conn, username: "Peer", avatar: "👤" };
            conn.on('data', (data) => {
                if(data.type === 'PEERS_UPDATE') {
                    data.peers.forEach(p => {
                        if(p.id !== peer.id && !activeConnections[p.id]) {
                            connectToPeer(p.id, p.username, p.avatar);
                        }
                    });
                } else if(data.type === 'USER_INFO') {
                    peersInRoom[conn.peer] = { username: data.username, avatar: data.avatar };
                    if(activeConnections[conn.peer]) {
                        activeConnections[conn.peer].username = data.username;
                        activeConnections[conn.peer].avatar = data.avatar;
                    }
                    updateMembersUI();
                    rebuildMediaGrid();
                }
            });

            // Send our info
            conn.send({ type: 'USER_INFO', username: myUsername, avatar: myAvatar });
        }

        function setupCallEvents(call, peerId, metadata) {
            const username = metadata?.username || peersInRoom[peerId]?.username || "User";
            const avatar = metadata?.avatar || peersInRoom[peerId]?.avatar || "👤";
            const isScreen = metadata?.type === 'screen';

            if(!peersInRoom[peerId]) peersInRoom[peerId] = { username, avatar };

            call.on('stream', (remoteStream) => {
                activeConnections[peerId] = activeConnections[peerId] || {};
                activeConnections[peerId].stream = remoteStream;
                activeConnections[peerId].username = username;
                activeConnections[peerId].avatar = avatar;
                activeConnections[peerId].isScreen = isScreen;
                rebuildMediaGrid();
            });

            call.on('close', () => {
                if(activeConnections[peerId]) {
                    delete activeConnections[peerId].stream;
                }
                rebuildMediaGrid();
            });
        }

        function broadcastPeersList() {
            const peerList = Object.keys(activeConnections).map(id => ({
                id,
                username: activeConnections[id].username,
                avatar: activeConnections[id].avatar
            }));
            peerList.push({ id: peer.id, username: myUsername, avatar: myAvatar });

            Object.values(activeConnections).forEach(item => {
                if(item.conn && item.conn.open) {
                    item.conn.send({ type: 'PEERS_UPDATE', peers: peerList });
                }
            });
        }

        function enterRoomUI() {
            landingView.classList.add('hidden');
            roomView.classList.remove('hidden');
            roomTitleDisplay.textContent = currentLobbyName;
            roomIdBadge.textContent = "Code: " + currentLobbyId;
            rebuildMediaGrid();
            updateMembersUI();
        }

        // UI Updates & Grid Management (Discord Style Tiles)
        function rebuildMediaGrid() {
            mediaGrid.innerHTML = '';

            // Collect all participants: Self + Active Connections
            const participants = [];
            participants.push({
                id: myPeerId || 'self',
                username: myUsername + " (You)",
                avatar: myAvatar,
                stream: screenStream || myStream,
                isScreen: !!screenStream,
                isSelf: true
            });

            Object.keys(activeConnections).forEach(id => {
                const conn = activeConnections[id];
                participants.push({
                    id: id,
                    username: conn.username || "User",
                    avatar: conn.avatar || "👤",
                    stream: conn.stream,
                    isScreen: conn.isScreen,
                    isSelf: false
                });
            });

            participants.forEach(p => {
                const tile = document.createElement('div');
                tile.className = "bg-discord-darker rounded-xl overflow-hidden relative flex flex-col items-center justify-center border border-gray-700/50 aspect-video shadow-lg";

                if (p.stream && p.stream.getVideoTracks().length > 0) {
                    const video = document.createElement('video');
                    video.srcObject = p.stream;
                    video.autoplay = true;
                    video.playsInline = true;
                    if (p.isSelf && !p.isScreen) video.muted = true; // Prevent local mic echo feedback loop
                    // Prevent feedback loop for screenshare audio if broadcaster hears own audio
                    if (p.isSelf && p.isScreen) video.muted = true; 
                    video.className = "w-full h-full object-cover";
                    tile.appendChild(video);

                    // Username overlay badge
                    const badge = document.createElement('div');
                    badge.className = "absolute bottom-3 left-3 bg-black/60 backdrop-blur-sm px-3 py-1 rounded-lg text-xs font-medium text-white flex items-center gap-2";
                    badge.innerHTML = `<span>${p.avatar}</span><span>${p.username}</span>`;
                    tile.appendChild(badge);
                } else {
                    // Fallback profile avatar tile when not streaming/sharing
                    const avatarContainer = document.createElement('div');
                    avatarContainer.className = "flex flex-col items-center justify-center gap-3";
                    avatarContainer.innerHTML = `
                        <div class="w-20 h-20 rounded-full bg-discord-accent/20 flex items-center justify-center text-4xl shadow-inner border border-discord-accent/40">
                            ${p.avatar}
                        </div>
                        <span class="font-semibold text-sm text-gray-200">${p.username}</span>
                    `;
                    tile.appendChild(avatarContainer);
                }

                mediaGrid.appendChild(tile);
            });
        }

        function updateMembersUI() {
            membersList.innerHTML = '';
            
            // Add self
            const selfDiv = document.createElement('div');
            selfDiv.className = "flex items-center gap-3 p-2 rounded-lg bg-discord-dark/40";
            selfDiv.innerHTML = `<span class="text-xl">${myAvatar}</span><span class="text-sm font-medium text-white truncate flex-1">${myUsername} (You)</span>`;
            membersList.appendChild(selfDiv);

            // Add peers
            Object.keys(activeConnections).forEach(id => {
                const conn = activeConnections[id];
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 rounded-lg hover:bg-discord-dark/20 transition";
                div.innerHTML = `<span class="text-xl">${conn.avatar || '👤'}</span><span class="text-sm font-medium text-gray-300 truncate flex-1">${conn.username || 'User'}</span>`;
                membersList.appendChild(div);
            });

            const totalMembers = Object.keys(activeConnections).length + 1;
            memberCount.textContent = totalMembers;
        }

        // Media Controls (Mic, Cam, Screen Share)
        let micEnabled = true;
        let camEnabled = false;

        toggleMicBtn.addEventListener('click', async () => {
            if(!myStream) {
                try {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch(e) {
                    alert("Microphone permission denied.");
                    return;
                }
            }
            micEnabled = !micEnabled;
            myStream.getAudioTracks().forEach(track => track.enabled = micEnabled);
            toggleMicBtn.className = micEnabled 
                ? "w-12 h-12 rounded-full bg-discord-sidebar hover:bg-gray-600 flex items-center justify-center text-white transition text-lg"
                : "w-12 h-12 rounded-full bg-discord-red hover:bg-red-600 flex items-center justify-center text-white transition text-lg";
            toggleMicBtn.innerHTML = micEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
        });

        toggleCamBtn.addEventListener('click', async () => {
            try {
                if(!camEnabled) {
                    const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: micEnabled });
                    myStream = camStream;
                    camEnabled = true;
                    toggleCamBtn.className = "w-12 h-12 rounded-full bg-discord-green hover:bg-green-600 flex items-center justify-center text-white transition text-lg";
                } else {
                    myStream.getVideoTracks().forEach(track => track.stop());
                    camEnabled = false;
                    toggleCamBtn.className = "w-12 h-12 rounded-full bg-discord-sidebar hover:bg-gray-600 flex items-center justify-center text-white transition text-lg";
                }
                rebuildMediaGrid();
                updatePeerCalls();
            } catch(e) {
                alert("Camera permission error or unavailable.");
            }
        });

        toggleScreenBtn.addEventListener('click', async () => {
            try {
                if(!screenStream) {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    
                    // Handle stream stop by user browser sharing UI button
                    screenStream.getVideoTracks()[0].onended = () => {
                        stopScreenShare();
                    };

                    toggleScreenBtn.className = "w-12 h-12 rounded-full bg-discord-green hover:bg-green-600 flex items-center justify-center text-white transition text-lg";
                    rebuildMediaGrid();
                    updatePeerCalls('screen', screenStream);
                } else {
                    stopScreenShare();
                }
            } catch(e) {
                console.log("Screen share cancelled or failed", e);
            }
        });

        function stopScreenShare() {
            if(screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            toggleScreenBtn.className = "w-12 h-12 rounded-full bg-discord-sidebar hover:bg-gray-600 flex items-center justify-center text-white transition text-lg";
            rebuildMediaGrid();
            updatePeerCalls('cam', myStream);
        }

        function updatePeerCalls(type = 'cam', streamToShare = myStream) {
            Object.keys(activeConnections).forEach(id => {
                if(peer && streamToShare) {
                    const call = peer.call(id, streamToShare, { metadata: { type: type, username: myUsername, avatar: myAvatar } });
                    setupCallEvents(call, id);
                }
            });
        }

        // Exit Room
        exitRoomBtn.addEventListener('click', () => {
            if(peer) peer.destroy();
            if(myStream) myStream.getTracks().forEach(t => t.stop());
            if(screenStream) screenStream.getTracks().forEach(t => t.stop());
            activeConnections = {};
            peersInRoom = {};
            myStream = null;
            screenStream = null;
            
            roomView.classList.add('hidden');
            landingView.classList.remove('hidden');
            window.history.replaceState({}, document.title, window.location.pathname);
        });

        // Invite Modal Actions
        shareInviteBtn.addEventListener('click', () => {
            const inviteUrl = window.location.origin + window.location.pathname + "?invite=" + currentLobbyId;
            inviteUrlInput.value = inviteUrl;
            inviteQrCode.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(inviteUrl)}`;
            inviteModal.classList.remove('hidden');
        });

        copyInviteBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(inviteUrlInput.value);
            copyInviteBtn.textContent = "Copied!";
            setTimeout(() => { copyInviteBtn.textContent = "Copy"; }, 2000);
        });

        closeInviteModal.addEventListener('click', () => {
            inviteModal.classList.add('hidden');
        });
    </script>
</body>
</html>
